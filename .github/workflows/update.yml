name: Update prices

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check prices
        run: python3 tracker.py update
      - name: Save new prices to the repository
        run: |
          if ! git diff --quiet data/store.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/store.json
            git commit -m "Update prices"
            git push
          fi
      - name: Build site
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/prices.js site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
